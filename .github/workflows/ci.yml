name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, dataset, and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGRES_TEST_URL: postgresql+asyncpg://kira:ci-only@127.0.0.1:5432/kira_ci
      RUN_MEMORY_POLICY_EVAL: "0"
      RUN_CROSS_SESSION_EVAL: "0"
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: kira_ci
          POSTGRES_USER: kira
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kira -d kira_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install locked Python environment
        run: |
          python -m pip install uv==0.11.2
          uv sync --frozen --all-extras

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Validate dataset and deterministic harness
        run: |
          uv run python -m scripts.benchmark.validate_dataset dataset/kira_ltm_v1 --json
          uv run python -m scripts.benchmark.mock_acceptance --output "$RUNNER_TEMP/benchmark-mock-acceptance"

      - name: Run full backend suite with coverage and PostgreSQL integration
        run: uv run pytest

  frontend:
    name: Frontend and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: false
          package-manager-cache: false

      - name: Install locked frontend environment
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm install --frozen-lockfile

      - name: Lint, typecheck, unit test, and build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke
        run: pnpm test:e2e

  product-e2e:
    name: Product images and synthetic E2E
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUN_MEMORY_POLICY_EVAL: "0"
      RUN_CROSS_SESSION_EVAL: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install locked Python environment
        run: |
          python -m pip install uv==0.11.2
          uv sync --frozen --all-extras

      - name: Validate product Compose
        run: docker compose -f compose.product.yaml config --quiet

      - name: Build product images and start explicit mocks
        run: docker compose -f compose.product.yaml up -d --build --wait

      - name: Run product E2E
        run: uv run python -m scripts.local.smoke_product_e2e

      - name: Remove disposable product stack
        if: always()
        run: >-
          docker compose -f compose.product.yaml -f compose.observability.yaml
          down --volumes --remove-orphans
