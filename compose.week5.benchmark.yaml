# Offline runtime for internal benchmark acceptance. Every image must be loaded or mirrored first.
name: kira-context-week5-benchmark

x-env-file: &env-file
  - ${WEEK5_ENV_FILE:-.env.week5.internal.local}

x-provider-runtime: &provider-runtime
  APP_ENVIRONMENT: test
  DEV_STATIC_IDENTITY_ENABLED: "true"
  DEV_STATIC_USER_ID: week5-synthetic-user
  LTM_ENABLED: "true"
  MEMORY_FORMATION_ENABLED: "true"
  MEMORY_SCHEMA: memory
  MEMORY_COLLECTION_NAME: memories
  MEMORY_POSTGRES_MIN_CONNECTIONS: "1"
  MEMORY_POSTGRES_MAX_CONNECTIONS: "5"
  MEMORY_LLM_TEMPERATURE: "0"
  MEMORY_LLM_MAX_TOKENS: "1000"
  MEMORY_SEARCH_TOP_K: ${WEEK5_RETRIEVAL_TOP_K:-10}
  MEMORY_SEARCH_THRESHOLD: ${WEEK5_RETRIEVAL_THRESHOLD:-0.1}
  MEMORY_SEARCH_TIMEOUT_SECONDS: "10"
  MEMORY_OPERATION_TIMEOUT_SECONDS: "60"
  OTEL_ENABLED: "false"

x-worker-runtime: &worker-runtime
  MEMORY_JOB_POLL_INTERVAL_SECONDS: "0.5"
  MEMORY_JOB_BATCH_SIZE: "10"
  MEMORY_JOB_CONCURRENCY: "2"
  MEMORY_JOB_LEASE_SECONDS: "120"
  MEMORY_JOB_MAX_ATTEMPTS: "5"
  MEMORY_JOB_RETRY_DELAYS_SECONDS: "[1,5,30,120]"
  MEMORY_JOB_DB_TIMEOUT_SECONDS: "5"
  MEMORY_JOB_SHUTDOWN_GRACE_SECONDS: "30"
  WORKER_HOST: 0.0.0.0
  WORKER_PORT: "8001"
  HEALTH_PORT: "8001"

x-postgres-health: &postgres-health
  interval: 2s
  timeout: 3s
  retries: 30
  start_period: 3s

x-app-health: &app-health
  interval: 3s
  timeout: 3s
  retries: 40
  start_period: 5s

services:
  control-postgres:
    profiles: [control]
    image: ${WEEK5_POSTGRES_IMAGE:?set WEEK5_POSTGRES_IMAGE}
    pull_policy: never
    environment:
      POSTGRES_DB: kira_control
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: ${WEEK5_POSTGRES_PASSWORD:?set WEEK5_POSTGRES_PASSWORD}
    volumes:
      - week5-control-postgres:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-health
      test: ["CMD-SHELL", "pg_isready -U kira -d kira_control"]

  control-migrate:
    profiles: [control]
    image: ${WEEK5_CONTROL_IMAGE:?set WEEK5_CONTROL_IMAGE}
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    env_file: *env-file
    environment:
      DATABASE_URL: postgresql+asyncpg://kira:${WEEK5_POSTGRES_PASSWORD}@control-postgres:5432/kira_control
    depends_on:
      control-postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  control-memory-init:
    profiles: [control]
    image: ${WEEK5_CONTROL_IMAGE:?set WEEK5_CONTROL_IMAGE}
    pull_policy: never
    command: ["python", "-m", "worker.memory_admin", "init"]
    env_file: *env-file
    environment:
      <<: *provider-runtime
      DATABASE_URL: postgresql+asyncpg://kira:${WEEK5_POSTGRES_PASSWORD}@control-postgres:5432/kira_control
      MEMORY_DATABASE_URL: postgresql://kira:${WEEK5_POSTGRES_PASSWORD}@control-postgres:5432/kira_control
      MEMORY_ADMIN_DATABASE_URL: postgresql://kira:${WEEK5_POSTGRES_PASSWORD}@control-postgres:5432/kira_control
    depends_on:
      control-migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  control-gateway:
    profiles: [control]
    image: ${WEEK5_CONTROL_IMAGE:?set WEEK5_CONTROL_IMAGE}
    pull_policy: never
    init: true
    env_file: *env-file
    environment:
      <<: *provider-runtime
      DATABASE_URL: postgresql+asyncpg://kira:${WEEK5_POSTGRES_PASSWORD}@control-postgres:5432/kira_control
      MEMORY_DATABASE_URL: postgresql://kira:${WEEK5_POSTGRES_PASSWORD}@control-postgres:5432/kira_control
      HEALTH_PORT: "8000"
    ports:
      - "127.0.0.1:28000:8000"
    depends_on:
      control-memory-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *app-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"]

  control-worker:
    profiles: [control]
    image: ${WEEK5_CONTROL_IMAGE:?set WEEK5_CONTROL_IMAGE}
    pull_policy: never
    init: true
    command: ["python", "-m", "worker.main"]
    env_file: *env-file
    environment:
      <<: [*provider-runtime, *worker-runtime]
      DATABASE_URL: postgresql+asyncpg://kira:${WEEK5_POSTGRES_PASSWORD}@control-postgres:5432/kira_control
      MEMORY_DATABASE_URL: postgresql://kira:${WEEK5_POSTGRES_PASSWORD}@control-postgres:5432/kira_control
    ports:
      - "127.0.0.1:28001:8001"
    depends_on:
      control-memory-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *app-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2).read()"]

  candidate-postgres:
    profiles: [candidate]
    image: ${WEEK5_POSTGRES_IMAGE:?set WEEK5_POSTGRES_IMAGE}
    pull_policy: never
    environment:
      POSTGRES_DB: kira_candidate
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: ${WEEK5_POSTGRES_PASSWORD:?set WEEK5_POSTGRES_PASSWORD}
    volumes:
      - week5-candidate-postgres:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-health
      test: ["CMD-SHELL", "pg_isready -U kira -d kira_candidate"]

  candidate-migrate:
    profiles: [candidate]
    image: ${WEEK5_CANDIDATE_IMAGE:?set WEEK5_CANDIDATE_IMAGE}
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    env_file: *env-file
    environment:
      DATABASE_URL: postgresql+asyncpg://kira:${WEEK5_POSTGRES_PASSWORD}@candidate-postgres:5432/kira_candidate
    depends_on:
      candidate-postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  candidate-memory-init:
    profiles: [candidate]
    image: ${WEEK5_CANDIDATE_IMAGE:?set WEEK5_CANDIDATE_IMAGE}
    pull_policy: never
    command: ["python", "-m", "worker.memory_admin", "init"]
    env_file: *env-file
    environment:
      <<: *provider-runtime
      DATABASE_URL: postgresql+asyncpg://kira:${WEEK5_POSTGRES_PASSWORD}@candidate-postgres:5432/kira_candidate
      MEMORY_DATABASE_URL: postgresql://kira:${WEEK5_POSTGRES_PASSWORD}@candidate-postgres:5432/kira_candidate
      MEMORY_ADMIN_DATABASE_URL: postgresql://kira:${WEEK5_POSTGRES_PASSWORD}@candidate-postgres:5432/kira_candidate
    depends_on:
      candidate-migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  candidate-gateway:
    profiles: [candidate]
    image: ${WEEK5_CANDIDATE_IMAGE:?set WEEK5_CANDIDATE_IMAGE}
    pull_policy: never
    init: true
    env_file: *env-file
    environment:
      <<: *provider-runtime
      DATABASE_URL: postgresql+asyncpg://kira:${WEEK5_POSTGRES_PASSWORD}@candidate-postgres:5432/kira_candidate
      MEMORY_DATABASE_URL: postgresql://kira:${WEEK5_POSTGRES_PASSWORD}@candidate-postgres:5432/kira_candidate
      HEALTH_PORT: "8000"
    ports:
      - "127.0.0.1:38000:8000"
    depends_on:
      candidate-memory-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *app-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"]

  candidate-worker:
    profiles: [candidate]
    image: ${WEEK5_CANDIDATE_IMAGE:?set WEEK5_CANDIDATE_IMAGE}
    pull_policy: never
    init: true
    command: ["python", "-m", "worker.main"]
    env_file: *env-file
    environment:
      <<: [*provider-runtime, *worker-runtime]
      DATABASE_URL: postgresql+asyncpg://kira:${WEEK5_POSTGRES_PASSWORD}@candidate-postgres:5432/kira_candidate
      MEMORY_DATABASE_URL: postgresql://kira:${WEEK5_POSTGRES_PASSWORD}@candidate-postgres:5432/kira_candidate
    ports:
      - "127.0.0.1:38001:8001"
    depends_on:
      candidate-memory-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *app-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2).read()"]

  eval-controller:
    profiles: [tools]
    image: ${WEEK5_EVAL_IMAGE:?set WEEK5_EVAL_IMAGE}
    pull_policy: never
    init: true
    env_file: *env-file
    environment:
      # The operator selects one running variant at a time. These non-secret selectors override
      # the generic values in the env file; the password is interpolated without being placed on
      # a command line.
      WEEK5_GATEWAY_URL: http://${WEEK5_BENCHMARK_GATEWAY_HOST:-candidate-gateway}:8000
      WEEK5_WORKER_URL: http://${WEEK5_BENCHMARK_WORKER_HOST:-candidate-worker}:8001
      WEEK5_DATABASE_URL: postgresql://kira:${WEEK5_POSTGRES_PASSWORD}@${WEEK5_BENCHMARK_POSTGRES_HOST:-candidate-postgres}:5432/${WEEK5_BENCHMARK_DATABASE:-kira_candidate}
      WEEK5_MEMORY_DATABASE_URL: postgresql://kira:${WEEK5_POSTGRES_PASSWORD}@${WEEK5_BENCHMARK_POSTGRES_HOST:-candidate-postgres}:5432/${WEEK5_BENCHMARK_DATABASE:-kira_candidate}
    volumes:
      - ${WEEK5_ARTIFACT_ROOT:-./artifacts/week5/benchmark}:/artifacts
      - ${WEEK5_MATERIALIZATION_ROOT:-./artifacts/week5}:/materialization
      - ${WEEK5_DATASET_ROOT:-./dataset/kira_ltm_v1}:/app/dataset/kira_ltm_v1
    command: ["validate"]

volumes:
  week5-control-postgres:
  week5-candidate-postgres:
