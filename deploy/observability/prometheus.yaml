global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/kira-rules.yaml

scrape_configs:
  - job_name: kira-otel-metrics
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: otel-collector-internal
    static_configs:
      - targets: [otel-collector:8888]

