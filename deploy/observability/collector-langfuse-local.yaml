extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  filter/drop_idle_memory_job_claims:
    error_mode: ignore
    traces:
      span:
        - >-
          name == "memory_job.claim" and
          attributes["kira.memory.job.claimed_count"] == 0 and
          attributes["kira.memory.job.reclaimed_count"] == 0
  batch:
    send_batch_size: 128
    send_batch_max_size: 256
    timeout: 1s

exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: ${env:LANGFUSE_OTEL_AUTH}
      x-langfuse-ingestion-version: "4"
    timeout: 1s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 256
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: false

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_scope_info: true
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_idle_memory_job_claims, batch]
      exporters: [otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
