# Review templates first; bind REPLACE_*_IMAGE before apply.
apiVersion: v1
kind: Pod
metadata:
  name: kira-operator
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: ops
spec:
  serviceAccountName: kira-runtime
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 45
  nodeSelector:
    infra/zone: compute
    project: lhvtt
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
  tolerations:
  - key: project
    operator: Equal
    value: lhvtt
    effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchFields:
          - key: metadata.name
            operator: In
            values:
            - hkh9104-10-221-248-16
        - matchFields:
          - key: metadata.name
            operator: In
            values:
            - hkh9104-10-221-248-17
        - matchFields:
          - key: metadata.name
            operator: In
            values:
            - hkh9104-10-221-248-18
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        preference:
          matchFields:
          - key: metadata.name
            operator: In
            values:
            - hkh9104-10-221-248-17
      - weight: 50
        preference:
          matchFields:
          - key: metadata.name
            operator: In
            values:
            - hkh9104-10-221-248-18
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: ops
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
        ephemeral-storage: 1Gi
    image: REPLACE_BACKEND_IMAGE
    command:
    - python
    - -c
    - import time; time.sleep(3600)
    env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: kira-database
          key: DATABASE_URL
  restartPolicy: Never
  activeDeadlineSeconds: 3600
