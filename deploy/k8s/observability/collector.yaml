# Single Collector: OTLP/HTTP traces to Langfuse, metrics exposed once for one Prometheus owner.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: otel-collector
  ports:
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
  - name: metrics
    port: 8889
    targetPort: metrics
  - name: self-metrics
    port: 8888
    targetPort: self-metrics
  - name: health
    port: 13133
    targetPort: health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 900
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: kira-context-memory
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: kira-context-memory
        app.kubernetes.io/component: otel-collector
    spec:
      serviceAccountName: kira-runtime
      automountServiceAccountToken: false
      nodeSelector:
        infra/zone: compute
        project: lhvtt
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      tolerations:
      - key: project
        operator: Equal
        value: lhvtt
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-16
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-17
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-18
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-17
          - weight: 50
            preference:
              matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-18
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: otel-collector
        image: REPLACE_OTEL_COLLECTOR_IMAGE
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
            ephemeral-storage: 128Mi
          limits:
            cpu: '8'
            memory: 8Gi
            ephemeral-storage: 1Gi
        args:
        - --config=/etc/otelcol-contrib/config.yaml
        env:
        - name: LANGFUSE_OTEL_AUTH
          valueFrom:
            secretKeyRef:
              name: kira-observability
              key: LANGFUSE_OTEL_AUTH
        - name: GOMEMLIMIT
          value: 4915MiB
        ports:
        - name: otlp-http
          containerPort: 4318
        - name: metrics
          containerPort: 8889
        - name: self-metrics
          containerPort: 8888
        - name: health
          containerPort: 13133
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol-contrib
          readOnly: true
        startupProbe:
          httpGet:
            path: /
            port: health
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /
            port: health
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: health
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: kira-otel-config
          items:
          - key: collector.yaml
            path: config.yaml
