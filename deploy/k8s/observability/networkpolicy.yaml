# Complements core default-deny/DNS policy; no internet egress or external UI ingress granted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-to-otel
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: app-to-otel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: kira-context-memory
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - gateway
      - worker
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: kira-context-memory
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - otel-collector
    ports:
    - protocol: TCP
      port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-ingestion
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: otel-ingestion
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: kira-context-memory
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - otel-collector
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: kira-context-memory
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - gateway
          - worker
          - ops
    ports:
    - protocol: TCP
      port: 4318
    - protocol: TCP
      port: 13133
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: kira-context-memory
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - prometheus
          - ops
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cattle-monitoring-system
    ports:
    - protocol: TCP
      port: 8888
    - protocol: TCP
      port: 8889
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: kira-context-memory
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - langfuse-web
    ports:
    - protocol: TCP
      port: 3000
---
