# OPTIONAL standalone metrics: do not apply when Rancher/platform Prometheus and Grafana own these signals.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kira-prometheus-config
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: kira-prometheus-config
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
    - /etc/prometheus/kira-rules.yaml
    scrape_configs:
    - job_name: kira-otel-metrics
      static_configs:
      - targets:
        - otel-collector:8889
      honor_labels: true
    - job_name: otel-collector-internal
      static_configs:
      - targets:
        - otel-collector:8888
      honor_labels: true
  kira-rules.yaml: |+
    groups:
      - name: kira-observability
        rules:
          - alert: KiraChatErrorRateHigh
            expr: |
              sum(rate(kira_chat_request_duration_seconds_count{outcome="error"}[5m]))
              /
              clamp_min(sum(rate(kira_chat_request_duration_seconds_count[5m])), 0.001)
              > 0.05
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: KiRa chat error rate exceeds 5%

          - alert: KiraMemoryQueueOldestPendingHigh
            expr: max(kira_memory_job_oldest_pending_age_seconds) > 300
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Oldest pending memory job is older than five minutes

          - alert: KiraMemoryWorkerQueueDatabaseUnavailable
            expr: min(kira_memory_job_queue_database_available_ratio) < 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: At least one memory Worker cannot observe the PostgreSQL queue

          - alert: KiraOtelMetricPointsDropped
            expr: |
              sum(increase(otelcol_receiver_refused_metric_points[5m]))
              +
              sum(increase(otelcol_receiver_failed_metric_points[5m]))
              > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: The OTel Collector refused or failed application metric points

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kira-grafana-provisioning
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: kira-grafana-provisioning
data:
  datasource.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          manageAlerts: true
  provider.yaml: |+
    apiVersion: 1

    providers:
      - name: KiRa
        orgId: 1
        folder: KiRa
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /etc/grafana/kira-dashboards

  kira-overview.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "title": "Chat request rate by outcome",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (outcome) (rate(kira_chat_request_duration_seconds_count[5m]))",
              "legendFormat": "{{outcome}}"
            }
          ],
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "title": "Chat p95 latency",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(kira_chat_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95"
            }
          ],
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0}
        },
        {
          "id": 3,
          "title": "KiRa first-content p95",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(kira_stream_first_content_duration_seconds_bucket[5m])))",
              "legendFormat": "p95"
            }
          ],
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0}
        },
        {
          "id": 4,
          "title": "Shared memory queue depth",
          "description": "Each Worker observes the same PostgreSQL queue; max avoids replica double-counting.",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "max by (status) (kira_memory_job_queue_depth)",
              "legendFormat": "{{status}}"
            }
          ],
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8}
        },
        {
          "id": 5,
          "title": "Oldest pending memory job",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "targets": [
            {
              "refId": "A",
              "expr": "max(kira_memory_job_oldest_pending_age_seconds)",
              "legendFormat": "oldest"
            }
          ],
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8}
        },
        {
          "id": 6,
          "title": "Memory processing outcomes",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (outcome) (rate(kira_memory_job_process_count_total[5m]))",
              "legendFormat": "{{outcome}}"
            }
          ],
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8}
        },
        {
          "id": 7,
          "title": "Stage p95 latency",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, stage) (rate(kira_stage_duration_seconds_bucket[5m])))",
              "legendFormat": "{{stage}}"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
        },
        {
          "id": 8,
          "title": "Collector refused/failed metric points",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(otelcol_receiver_refused_metric_points[5m])) + sum(rate(otelcol_receiver_failed_metric_points[5m]))",
              "legendFormat": "metric points"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
        }
      ],
      "refresh": "15s",
      "schemaVersion": 41,
      "tags": ["kira", "otel"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "KiRa Observability Overview",
      "uid": "kira-observability-overview",
      "version": 1
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: prometheus-data
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: longhorn-storage-2-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: kira-context-memory
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: kira-context-memory
        app.kubernetes.io/component: prometheus
    spec:
      serviceAccountName: kira-runtime
      automountServiceAccountToken: false
      nodeSelector:
        infra/zone: compute
        project: lhvtt
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      tolerations:
      - key: project
        operator: Equal
        value: lhvtt
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-16
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-17
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-18
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-17
          - weight: 50
            preference:
              matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-18
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: REPLACE_PROMETHEUS_IMAGE
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 128Mi
          limits:
            cpu: '12'
            memory: 24Gi
            ephemeral-storage: 1Gi
        args:
        - --config.file=/etc/prometheus/prometheus.yaml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=30d
        - --storage.tsdb.retention.size=8GB
        ports:
        - name: http
          containerPort: 9090
        volumeMounts:
        - name: data
          mountPath: /prometheus
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        startupProbe:
          httpGet:
            path: /-/healthy
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
      - name: config
        configMap:
          name: kira-prometheus-config
---
