# Dedicated single-primary Langfuse stores; PVC sizes are pilot choices, not HA or measured capacity.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-postgres-data
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: langfuse-postgres-data
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: longhorn-storage-2-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: langfuse-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: langfuse-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-postgres
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: langfuse-postgres
spec:
  serviceName: langfuse-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: kira-context-memory
      app.kubernetes.io/component: langfuse-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: kira-context-memory
        app.kubernetes.io/component: langfuse-postgres
    spec:
      serviceAccountName: kira-runtime
      automountServiceAccountToken: false
      nodeSelector:
        infra/zone: compute
        project: lhvtt
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      tolerations:
      - key: project
        operator: Equal
        value: lhvtt
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-16
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-17
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-18
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-17
          - weight: 50
            preference:
              matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-18
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: langfuse-postgres
        image: REPLACE_LANGFUSE_POSTGRES_IMAGE
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 128Mi
          limits:
            cpu: '12'
            memory: 16Gi
            ephemeral-storage: 1Gi
        args:
        - -c
        - max_connections=200
        - -c
        - shared_buffers=2GB
        - -c
        - effective_cache_size=6GB
        - -c
        - max_wal_size=2GB
        env:
        - name: POSTGRES_DB
          value: langfuse
        - name: POSTGRES_USER
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_INITDB_ARGS
          value: --auth-host=scram-sha-256
        - name: TZ
          value: UTC
        - name: PGTZ
          value: UTC
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kira-observability
              key: LF_PG_ADMIN_PASSWORD
        - name: LF_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kira-observability
              key: LF_PG_PASSWORD
        ports:
        - name: postgres
          containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
        startupProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
            - -d
            - langfuse
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
            - -d
            - langfuse
          timeoutSeconds: 3
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
            - -d
            - langfuse
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: langfuse-postgres-data
      - name: init
        configMap:
          name: kira-langfuse-postgres-init
          defaultMode: 365
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
---
