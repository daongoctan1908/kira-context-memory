apiVersion: v1
kind: Service
metadata:
  name: langfuse-redis
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: langfuse-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: langfuse-redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-redis
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: langfuse-redis
spec:
  serviceName: langfuse-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: kira-context-memory
      app.kubernetes.io/component: langfuse-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: kira-context-memory
        app.kubernetes.io/component: langfuse-redis
    spec:
      serviceAccountName: kira-runtime
      automountServiceAccountToken: false
      nodeSelector:
        infra/zone: compute
        project: lhvtt
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      tolerations:
      - key: project
        operator: Equal
        value: lhvtt
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-16
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-17
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-18
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-17
          - weight: 50
            preference:
              matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-18
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: langfuse-redis
        image: REPLACE_LANGFUSE_REDIS_IMAGE
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
            ephemeral-storage: 128Mi
          limits:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 1Gi
        command:
        - sh
        - -ec
        args:
        - |
          umask 077
          printf '%s\n' 'bind 0.0.0.0' 'port 6379' 'dir /data' 'appendonly yes' 'appendfsync everysec' 'save ""' 'maxmemory 4gb' 'maxmemory-policy noeviction' > /tmp/kira-redis.conf
          printf 'requirepass %s\n' "$REDIS_PASSWORD" >> /tmp/kira-redis.conf
          exec redis-server /tmp/kira-redis.conf
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kira-observability
              key: LF_REDIS_PASSWORD
        ports:
        - name: redis
          containerPort: 6379
        volumeMounts:
        - name: data
          mountPath: /data
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -h 127.0.0.1 ping | grep -q
              PONG
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -h 127.0.0.1 ping | grep -q
              PONG
          timeoutSeconds: 3
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -h 127.0.0.1 ping | grep -q
              PONG
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: langfuse-redis-data
