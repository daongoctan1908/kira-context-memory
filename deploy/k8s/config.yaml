apiVersion: v1
kind: ConfigMap
metadata:
  name: kira-memory-config
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: kira-memory-config
data:
  MEMORY_SCHEMA: memory
  MEMORY_COLLECTION_NAME: memories
  MEMORY_EMBEDDING_BASE_URL: http://10.254.135.40:8001/v1
  MEMORY_EMBEDDING_MODEL: Qwen3-Embedding-0.6B
  MEMORY_EMBEDDING_DIMS: '1024'
  MEMORY_LLM_BASE_URL: http://10.254.135.40:8080/v1
