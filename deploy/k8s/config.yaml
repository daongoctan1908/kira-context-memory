  MEMORY_LLM_TEMPERATURE: '0'
  MEMORY_LLM_MAX_TOKENS: '1000'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: postgres
data:
  10-create-runtime-roles.sh: |
    #!/bin/sh
    set -eu
    # Initial database only. Passwords stay in environment/psql variables, not command arguments.
    psql -X -v ON_ERROR_STOP=1 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" <<'SQL'
    \getenv app_password KIRA_APP_DB_PASSWORD
    \getenv memory_password KIRA_MEMORY_DB_PASSWORD
    \getenv database POSTGRES_DB
    CREATE ROLE kira_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'app_password';
    CREATE ROLE kira_memory LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'memory_password';
    REVOKE CONNECT ON DATABASE :"database" FROM PUBLIC;
    GRANT CONNECT ON DATABASE :"database" TO kira_app, kira_memory;
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    GRANT USAGE ON SCHEMA public TO kira_app, kira_memory;
    CREATE SCHEMA IF NOT EXISTS memory AUTHORIZATION postgres;
    GRANT USAGE ON SCHEMA memory TO kira_app, kira_memory;
    ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public, memory
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO kira_app, kira_memory;
    ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public, memory
      GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO kira_app, kira_memory;
    SQL
