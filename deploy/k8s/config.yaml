  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: kira-runtime
automountServiceAccountToken: false
imagePullSecrets:
- name: registry-vlp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kira-runtime-config
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: kira-runtime-config
data:
  APP_ENVIRONMENT: test
  APP_VERSION: 0.4.1
  DEV_STATIC_IDENTITY_ENABLED: 'false'
  LTM_ENABLED: 'true'
  MEMORY_FORMATION_ENABLED: 'true'
  OTEL_ENABLED: 'false'
  OTEL_CAPTURE_CONTENT_ENABLED: 'false'
  POSTGRES_POOL_SIZE: '5'
  POSTGRES_MAX_OVERFLOW: '2'
  MEMORY_POSTGRES_MIN_CONNECTIONS: '1'
  MEMORY_POSTGRES_MAX_CONNECTIONS: '3'
  MEMORY_JOB_CONCURRENCY: '2'
  APP_LOG_LEVEL: INFO
  WORKER_LOG_LEVEL: INFO
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kira-gateway-config
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: kira-gateway-config
data:
  AUTH_ENABLED: 'true'
  AUTH_ALLOWED_ORIGIN: http://frontend:8080
  AUTH_COOKIE_SECURE: 'false'
  KIRA_BASE_URL: http://10.255.62.64:8122
  KIRA_DOMAIN: VBI
  KIRA_SERVICE_ID: '5'
  KIRA_DEVICE: Browser
  KIRA_MESSAGE_TYPE: text
  VLLM_BASE_URL: http://10.254.135.40:8080/v1
  VLLM_MODEL: /models/Qwen3_14B
  KIRA_READ_TIMEOUT_SECONDS: '300'
  HEALTH_PORT: '8000'
