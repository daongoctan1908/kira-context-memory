# Review templates first; bind REPLACE_*_IMAGE before apply.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-bootstrap
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: postgres-bootstrap
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_WITH_NEW_ADMIN_DB_PASSWORD
  KIRA_APP_DB_PASSWORD: REPLACE_WITH_NEW_APP_DB_PASSWORD
  KIRA_MEMORY_DB_PASSWORD: REPLACE_WITH_NEW_MEMORY_DB_PASSWORD
---
apiVersion: v1
kind: Secret
