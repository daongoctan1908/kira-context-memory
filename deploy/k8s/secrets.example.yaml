stringData:
  MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:REPLACE_WITH_NEW_ADMIN_DB_PASSWORD@postgres:5432/kira_context
  MEMORY_ADMIN_DATABASE_URL: postgresql://postgres:REPLACE_WITH_NEW_ADMIN_DB_PASSWORD@postgres:5432/kira_context
