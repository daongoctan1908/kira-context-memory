type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://kira_app:REPLACE_WITH_NEW_APP_DB_PASSWORD@postgres:5432/kira_context
  MEMORY_DATABASE_URL: postgresql://kira_memory:REPLACE_WITH_NEW_MEMORY_DB_PASSWORD@postgres:5432/kira_context
---
apiVersion: v1
kind: Secret
metadata:
