apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: default-deny
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: allow-dns
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-internal
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: frontend-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: kira-context-memory
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: kira-context-memory
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - gateway
    ports:
    - protocol: TCP
      port: 8000
---
