# Review templates first; bind REPLACE_*_IMAGE before apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: memory-init
  namespace: kira-context-memory
  labels:
    app.kubernetes.io/part-of: kira-context-memory
    app.kubernetes.io/component: memory-init
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: kira-context-memory
        app.kubernetes.io/component: memory-init
    spec:
      serviceAccountName: kira-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      nodeSelector:
        infra/zone: compute
        project: lhvtt
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      tolerations:
      - key: project
        operator: Equal
        value: lhvtt
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-16
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-17
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-18
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-17
          - weight: 50
            preference:
              matchFields:
              - key: metadata.name
                operator: In
                values:
                - hkh9104-10-221-248-18
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: memory-init
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 128Mi
          limits:
            cpu: '8'
            memory: 8Gi
            ephemeral-storage: 1Gi
        image: REPLACE_BACKEND_IMAGE
        command:
        - python
        - -m
        - worker.memory_admin
        - init
        envFrom:
        - configMapRef:
            name: kira-runtime-config
        - configMapRef:
            name: kira-memory-config
        - secretRef:
            name: kira-database
        env:
        - name: MEMORY_ADMIN_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: kira-database-admin
              key: MEMORY_ADMIN_DATABASE_URL
      restartPolicy: Never
