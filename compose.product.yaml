# Disposable, synthetic-only product stack for laptop acceptance.
# The defaults below are not production credentials and must never be reused outside this stack.
name: kira-context-product

x-runtime: &runtime
  image: kira-context:product-local
  pull_policy: never
  init: true

x-app-database: &app-database
  DATABASE_URL: postgresql+asyncpg://kira:local-product-only@postgres:5432/kira_product

x-memory-runtime: &memory-runtime
  MEMORY_DATABASE_URL: postgresql://kira:local-product-only@postgres:5432/kira_product
  MEMORY_SCHEMA: memory
  MEMORY_COLLECTION_NAME: memories
  MEMORY_POSTGRES_MIN_CONNECTIONS: "1"
  MEMORY_POSTGRES_MAX_CONNECTIONS: "5"
  MEMORY_EMBEDDING_BASE_URL: http://mock-embedding:8000
  MEMORY_EMBEDDING_MODEL: local-embedding-stub
  MEMORY_EMBEDDING_DIMS: "3"
  MEMORY_LLM_BASE_URL: http://mock-memory-llm:8000
  MEMORY_LLM_MODEL: local-memory-stub
  MEMORY_LLM_TEMPERATURE: "0"
  MEMORY_LLM_MAX_TOKENS: "1000"
  MEMORY_SEARCH_TIMEOUT_SECONDS: "3"
  MEMORY_OPERATION_TIMEOUT_SECONDS: "30"

x-mock-health: &mock-health
  interval: 2s
  timeout: 2s
  retries: 20
  start_period: 2s

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: kira_product
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: local-product-only
    ports:
      - "127.0.0.1:${PRODUCT_POSTGRES_PORT:-15434}:5432"
    volumes:
      - product-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kira -d kira_product"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s

  migrate:
    <<: *runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-database
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  auth-init:
    <<: *runtime
    command:
      - /bin/sh
      - -ec
      - |
        set +e
        printf '%s\n' "$$PRODUCT_ADMIN_PASSWORD" | python -m app.admin.auth_admin reset-password --username "$$PRODUCT_ADMIN_USERNAME" --password-stdin
        result=$$?
        set -e
        if [ "$$result" -eq 0 ]; then
          exit 0
        fi
        if [ "$$result" -ne 4 ]; then
          exit "$$result"
        fi
        printf '%s\n' "$$PRODUCT_ADMIN_PASSWORD" | python -m app.admin.auth_admin create --username "$$PRODUCT_ADMIN_USERNAME" --password-stdin
    environment:
      <<: *app-database
      PRODUCT_ADMIN_USERNAME: ${PRODUCT_ADMIN_USERNAME:-local-admin}
      PRODUCT_ADMIN_PASSWORD: ${PRODUCT_ADMIN_PASSWORD:-local-product-only}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  mock-kira:
    <<: *runtime
    command:
      ["uvicorn", "tests.support.mock_kira_server:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ./tests:/app/tests:ro
    ports:
      - "127.0.0.1:${PRODUCT_MOCK_KIRA_PORT:-18212}:8000"
    healthcheck:
      <<: *mock-health

  mock-rewriter:
    <<: *runtime
    command:
      ["uvicorn", "tests.support.mock_vllm_server:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ./tests:/app/tests:ro
    ports:
      - "127.0.0.1:${PRODUCT_MOCK_REWRITER_PORT:-18213}:8000"
    healthcheck:
      <<: *mock-health

  mock-embedding:
    <<: *runtime
    command:
      ["uvicorn", "tests.support.mock_embedding_server:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ./tests:/app/tests:ro
    ports:
      - "127.0.0.1:${PRODUCT_MOCK_EMBEDDING_PORT:-18214}:8000"
    healthcheck:
      <<: *mock-health

  mock-memory-llm:
    <<: *runtime
    command:
      ["uvicorn", "tests.support.mock_memory_llm_server:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ./tests:/app/tests:ro
    ports:
      - "127.0.0.1:${PRODUCT_MOCK_MEMORY_LLM_PORT:-18215}:8000"
    healthcheck:
      <<: *mock-health

  memory-init:
    <<: *runtime
    command: ["python", "-m", "worker.memory_admin", "init"]
    environment:
      <<: [*app-database, *memory-runtime]
      MEMORY_ADMIN_DATABASE_URL: postgresql://kira:local-product-only@postgres:5432/kira_product
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-embedding:
        condition: service_healthy
    healthcheck:
      disable: true

  gateway:
    <<: *runtime
    build:
      context: .
      args:
        APP_VERSION: 0.4.1
    environment:
      <<: [*app-database, *memory-runtime]
      APP_ENVIRONMENT: test
      AUTH_ENABLED: "true"
      AUTH_ALLOWED_ORIGIN: http://127.0.0.1:${PRODUCT_FRONTEND_PORT:-18080}
      AUTH_COOKIE_SECURE: "false"
      DEV_STATIC_IDENTITY_ENABLED: "false"
      KIRA_BASE_URL: http://mock-kira:8000
      KIRA_USERNAME: local-smoke
      KIRA_DOMAIN: VBI
      KIRA_BASIC_AUTH: local-stub-credential
      VLLM_BASE_URL: http://mock-rewriter:8000
      VLLM_MODEL: local-contract-stub
      LTM_ENABLED: "true"
      MEMORY_FORMATION_ENABLED: "true"
      HEALTH_PORT: "8000"
    ports:
      - "127.0.0.1:${PRODUCT_GATEWAY_PORT:-18200}:8000"
    depends_on:
      auth-init:
        condition: service_completed_successfully
      memory-init:
        condition: service_completed_successfully
      mock-kira:
        condition: service_healthy
      mock-rewriter:
        condition: service_healthy
      mock-embedding:
        condition: service_healthy
      mock-memory-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s

  worker:
    <<: *runtime
    command: ["python", "-m", "worker.main"]
    environment:
      <<: [*app-database, *memory-runtime]
      APP_ENVIRONMENT: test
      MEMORY_JOB_POLL_INTERVAL_SECONDS: "0.25"
      MEMORY_JOB_BATCH_SIZE: "10"
      MEMORY_JOB_CONCURRENCY: "2"
      MEMORY_JOB_LEASE_SECONDS: "120"
      MEMORY_JOB_MAX_ATTEMPTS: "5"
      MEMORY_JOB_RETRY_DELAYS_SECONDS: "[0.25,0.25,0.25,0.25]"
      MEMORY_JOB_DB_TIMEOUT_SECONDS: "5"
      MEMORY_JOB_SHUTDOWN_GRACE_SECONDS: "30"
      MEMORY_JOB_METRICS_REFRESH_SECONDS: "1"
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: "8001"
      HEALTH_PORT: "8001"
    ports:
      - "127.0.0.1:${PRODUCT_WORKER_PORT:-18201}:8001"
    depends_on:
      memory-init:
        condition: service_completed_successfully
      mock-embedding:
        condition: service_healthy
      mock-memory-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 35s

  frontend:
    image: kira-chat-frontend:product-local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      GATEWAY_UPSTREAM: gateway:8000
    ports:
      - "127.0.0.1:${PRODUCT_FRONTEND_PORT:-18080}:8080"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    stop_grace_period: 5s

volumes:
  product-postgres-data:
