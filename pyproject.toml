[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kira-context-memory"
version = "0.4.0"
description = "Context and long-term memory middleware for Viettel KiRa"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.16,<2.0",
    "anyio>=4.8,<5.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "prometheus-client>=0.21,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1.0",
    "viettel-mem0[postgres]==2.0.20+viettel.2",
]

[project.scripts]
kira-memory-jobs = "worker.job_admin:main"

[tool.uv.sources]
viettel-mem0 = { path = "packages/viettel-mem0" }

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "pytest-cov>=6.0,<8.0",
    "respx>=0.22,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=app --cov=worker --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "memory_llm_integration: explicit opt-in gate requiring configured internal model endpoints",
    "postgres_integration: requires POSTGRES_TEST_URL pointing to a disposable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["packages/viettel-mem0"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
