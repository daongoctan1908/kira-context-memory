# Isolated, synthetic-only Week 4 stack. Never reuse these credentials in production.
name: kira-context-week4

x-runtime: &runtime
  image: kira-context:0.4.0-t4.18
  init: true

x-app-database: &app-database
  DATABASE_URL: postgresql+asyncpg://kira:local-week4-only@postgres:5432/kira_week4

x-memory-runtime: &memory-runtime
  MEMORY_DATABASE_URL: postgresql://kira:local-week4-only@postgres:5432/kira_week4
  MEMORY_SCHEMA: memory
  MEMORY_COLLECTION_NAME: memories
  MEMORY_POSTGRES_MIN_CONNECTIONS: "1"
  MEMORY_POSTGRES_MAX_CONNECTIONS: "5"
  MEMORY_EMBEDDING_BASE_URL: http://mock-embedding:8000
  MEMORY_EMBEDDING_MODEL: local-embedding-stub
  MEMORY_EMBEDDING_DIMS: "3"
  MEMORY_LLM_BASE_URL: http://mock-memory-llm:8000
  MEMORY_LLM_MODEL: local-memory-stub
  MEMORY_LLM_TEMPERATURE: "0"
  MEMORY_LLM_MAX_TOKENS: "1000"
  MEMORY_SEARCH_TIMEOUT_SECONDS: "3"
  MEMORY_OPERATION_TIMEOUT_SECONDS: "30"

x-mock-health: &mock-health
  interval: 2s
  timeout: 2s
  retries: 20
  start_period: 2s

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: kira_week4
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: local-week4-only
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - week4-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kira -d kira_week4"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s

  migrate:
    <<: *runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-database
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  mock-kira:
    <<: *runtime
    command:
      ["uvicorn", "tests.support.mock_kira_server:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ./tests:/app/tests:ro
    ports:
      - "127.0.0.1:18122:8000"
    healthcheck:
      <<: *mock-health

  mock-rewriter:
    <<: *runtime
    command:
      ["uvicorn", "tests.support.mock_vllm_server:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ./tests:/app/tests:ro
    ports:
      - "127.0.0.1:18123:8000"
    healthcheck:
      <<: *mock-health

  mock-embedding:
    <<: *runtime
    command:
      ["uvicorn", "tests.support.mock_embedding_server:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ./tests:/app/tests:ro
    ports:
      - "127.0.0.1:18124:8000"
    healthcheck:
      <<: *mock-health

  mock-memory-llm:
    <<: *runtime
    command:
      ["uvicorn", "tests.support.mock_memory_llm_server:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ./tests:/app/tests:ro
    ports:
      - "127.0.0.1:18125:8000"
    healthcheck:
      <<: *mock-health

  memory-init:
    <<: *runtime
    command: ["python", "-m", "worker.memory_admin", "init"]
    environment:
      <<: [*app-database, *memory-runtime]
      MEMORY_ADMIN_DATABASE_URL: postgresql://kira:local-week4-only@postgres:5432/kira_week4
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-embedding:
        condition: service_healthy
    healthcheck:
      disable: true

  gateway:
    <<: *runtime
    build:
      context: .
      args:
        APP_VERSION: 0.4.0-t4.18
    environment:
      <<: [*app-database, *memory-runtime]
      KIRA_BASE_URL: http://mock-kira:8000
      KIRA_USERNAME: local-smoke
      KIRA_DOMAIN: VBI
      KIRA_BASIC_AUTH: local-stub-credential
      VLLM_BASE_URL: http://mock-rewriter:8000
      VLLM_MODEL: local-contract-stub
      APP_ENVIRONMENT: test
      DEV_STATIC_IDENTITY_ENABLED: "true"
      DEV_STATIC_USER_ID: local-week4-user
      LTM_ENABLED: "true"
      MEMORY_FORMATION_ENABLED: "true"
      HEALTH_PORT: "8000"
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      memory-init:
        condition: service_completed_successfully
      mock-kira:
        condition: service_healthy
      mock-rewriter:
        condition: service_healthy
      mock-embedding:
        condition: service_healthy
      mock-memory-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s

  worker:
    <<: *runtime
    command: ["python", "-m", "worker.main"]
    environment:
      <<: [*app-database, *memory-runtime]
      MEMORY_JOB_POLL_INTERVAL_SECONDS: "0.25"
      MEMORY_JOB_BATCH_SIZE: "10"
      MEMORY_JOB_CONCURRENCY: "2"
      MEMORY_JOB_LEASE_SECONDS: "120"
      MEMORY_JOB_MAX_ATTEMPTS: "5"
      # Accelerated synthetic E2E schedule; WorkerSettings production defaults remain 1/5/30/120.
      MEMORY_JOB_RETRY_DELAYS_SECONDS: "[0.25,0.25,0.25,0.25]"
      MEMORY_JOB_DB_TIMEOUT_SECONDS: "5"
      MEMORY_JOB_SHUTDOWN_GRACE_SECONDS: "30"
      MEMORY_JOB_METRICS_REFRESH_SECONDS: "1"
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: "8001"
      HEALTH_PORT: "8001"
    ports:
      - "127.0.0.1:18001:8001"
    depends_on:
      memory-init:
        condition: service_completed_successfully
      mock-embedding:
        condition: service_healthy
      mock-memory-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 35s

volumes:
  week4-postgres-data:
