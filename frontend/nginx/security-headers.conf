# Radix modal scroll locking inserts a stylesheet containing the measured scrollbar gap.
# Permit those style elements; style attributes still inherit style-src 'self'.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https://charts.vietteltelecom.vn; object-src 'none'; script-src 'self'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
